name: Tithika Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tithika-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/home.js
          node --check assets/tithika-site.js

      - name: Validate route map
        run: php scripts/validate-routes.php

      - name: SEO content accessibility and release audit
        run: php scripts/test-release-hardening.php

      - name: Production certification contract
        run: php scripts/test-production-certification.php

      - name: Panchang regression fixture
        run: python scripts/test-panchang.py

      - name: Month Panchang regression fixture
        run: python scripts/test-panchang-month.py

      - name: Lunar occurrence regression fixtures
        run: python scripts/test-lunar-occurrences.py

      - name: Vrat observance regression fixtures
        run: python scripts/test-observances.py

      - name: Vrat recurrence regression fixture
        run: python scripts/test-vrat-recurrence.py

      - name: Mahadwadashi regression fixture
        run: python scripts/test-mahadwadashi.py

      - name: Dwadashi regression fixture
        run: python scripts/test-dwadashi.py

      - name: Shared Vrat rule regression fixture
        run: python scripts/test-vrat-rules.py

      - name: Lagna regression fixture
        run: python scripts/test-lagna.py

      - name: Planetary ephemeris regression fixtures
        run: python scripts/test-planetary.py

      - name: Jyotish calculator regression fixtures
        run: python scripts/test-jyotish.py

      - name: Vimshottari Dasha regression fixture
        run: python scripts/test-vimshottari.py

      - name: Jyotish dosha regression fixtures
        run: python scripts/test-doshas.py

      - name: Ashtakavarga regression fixture
        run: python scripts/test-ashtakavarga.py

      - name: Shodashavarga regression fixtures
        run: python scripts/test-vargas.py

      - name: Structural Yoga regression fixtures
        run: python scripts/test-yogas.py

      - name: Complete Shadbala regression fixture
        run: python scripts/test-shadbala.py

      - name: Ashtakoota matching regression fixtures
        run: python scripts/test-matching.py

      - name: Deep marriage analysis regression fixture
        run: python scripts/test-marriage-analysis.py

      - name: Planetary aspects and Yuddha regression fixtures
        run: python scripts/test-aspects.py

      - name: Eclipse regression fixtures
        run: python scripts/test-eclipses.py

      - name: Janma Kundali regression fixture
        run: python scripts/test-kundali.py

      - name: Unified horoscope analysis regression fixture
        run: python scripts/test-horoscope-analysis.py

      - name: Jyotish interpretation regression fixture
        run: python scripts/test-interpretation.py

      - name: Jyotish timing timeline regression fixture
        run: python scripts/test-timing-timeline.py

      - name: Personalized Rashifal regression fixture
        run: python scripts/test-personal-rashifal.py

      - name: Major festival regression fixtures
        run: python scripts/test-festivals.py

      - name: Festival rule registry fixture
        run: python scripts/test-festival-rule-registry.py

      - name: Shared Muhurat rule fixture
        run: python scripts/test-muhurat-rules.py

      - name: Specialized Muhurat profile fixture
        run: python scripts/test-specialized-muhurat.py

      - name: Muhurat reuse regression fixture
        run: python scripts/test-muhurat-reuse.py

      - name: Panchang utility regression fixture
        run: python scripts/test-panchang-utilities.py

      - name: Panchang reuse regression fixture
        run: python scripts/test-panchang-reuse.py

      - name: Regional calendar regression fixture
        run: python scripts/test-regional-calendar.py

      - name: Nepali Bikram Sambat regression fixture
        run: python scripts/test-nepali-calendar.py

      - name: Jain Kartikadi calendar regression fixture
        run: python scripts/test-jain-calendar.py

      - name: Equinox and solstice regression fixture
        run: python scripts/test-seasons.py

      - name: Sankranti ingress regression fixture
        run: python scripts/test-sankranti.py

      - name: Panchang completion regression fixture
        run: python scripts/test-panchang-completion.py

      - name: Muhurat completion regression fixture
        run: python scripts/test-muhurat-completion.py

      - name: Vrat completion regression fixture
        run: python scripts/test-vrat-completion.py

      - name: Festival calendar completion regression fixture
        run: python scripts/test-festival-calendar-completion.py

      - name: Secondary Jyotish regression fixture
        run: python scripts/test-jyotish-secondary.py

      - name: Astronomy reference regression fixture
        run: python scripts/test-astronomy-reference.py

      - name: Repository semantic hardening guard
        run: python scripts/test-semantic-hardening.py
